<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>旅行記録アプリ</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>旅行記録アプリ</h1>
        <p>旅の思い出を残そう。</p>
    </header>


    <main>

        <!-- 旅行記を入力する場所 -->
        <section class="form-section">

            <h2>新しい旅行を記録</h2>

            <form action="/save" method="POST">

                <label for="place">
                    旅行先
                </label>

                <input
                    type="text"
                    id="place"
                    name="place"
                    placeholder="例：福岡"
                    required
                >


                <label for="date">
                    日付
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >


                <label for="memory">
                    思い出
                </label>

                <textarea
                    id="memory"
                    name="memory"
                    placeholder="楽しかったことを書こう！"
                    required
                ></textarea>


                <button type="submit">
                    記録する
                </button>

            </form>

        </section>


        <!-- 保存した旅行記 -->
        <section class="records-section">

            <h2>旅行記録</h2>

            {{RECORDS}}

        </section>

    </main>


    <footer>
        <p>© 2026 旅行記録アプリ</p>
    </footer>

</body>

</html>
